<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link data-rh="true" rel="icon" href="https://avatars.githubusercontent.com/u/67739845?v=4">
    <title>部落格管理工具</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <!-- Firebase配置 -->
    <script src="config/firebase-config.js"></script>
    
    <!-- CSS樣式表 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 主題相關樣式 -->
    <link rel="stylesheet" href="style/pages/index/themes/variables.css">
    <link rel="stylesheet" href="style/pages/index/themes/default-theme.css">
    <link rel="stylesheet" href="style/pages/index/themes/dark-theme.css">
    <link rel="stylesheet" href="style/pages/index/themes/green-theme.css">
    <link rel="stylesheet" href="style/pages/index/themes/ocean-theme.css">
    <link rel="stylesheet" href="style/pages/index/themes/warm-theme.css">
    <link rel="stylesheet" href="style/pages/index/ui/theme-switcher.css">
    
    <!-- 頁面樣式 -->
    <link rel="stylesheet" href="style/pages/blog-admin-redesign/layout.css">
    <link rel="stylesheet" href="style/pages/blog-admin-redesign/sidebar.css">
    <link rel="stylesheet" href="style/pages/blog-admin-redesign/content.css">
    <link rel="stylesheet" href="style/pages/blog-admin-redesign/forms.css">
</head>
<body>
    <div class="page-transition-overlay"></div>
    <!-- 登錄頁面 -->
    <div id="loginContainer" class="login-container">
        <h2>部落格管理後臺</h2>
        <p>請登入以繼續</p>
        <div class="form-group">
            <input type="email" id="emailInput" placeholder="電子郵件" required>
        </div>
        <div class="form-group">
            <input type="password" id="passwordInput" placeholder="密碼" required>
        </div>
        <button id="loginBtn" class="btn btn-primary" style="width: 100%;">登入</button>
        <p id="loginError" style="color: #f74a4a; margin-top: 10px;"></p>
    </div>

    <!-- 主應用容器 -->
    <div id="appContainer" class="app-container" style="display: none;">
        <!-- 側邊欄 -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">部落格管理</div>
                <button id="sidebarToggle" class="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="sidebar-content">
                <!-- 分類部分 -->
                <div class="sidebar-section collapsible-section">
                    <div class="section-header">
                        <div class="section-title">
                            <i class="fas fa-folder"></i>
                            <span>分類</span>
                            <i class="fas fa-chevron-down toggle-icon" style="margin-left: 5px; font-size: 12px;"></i>
                        </div>
                        <div class="section-actions">
                            <button id="addCategoryBtn" class="btn-icon" title="新增分類">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                    <ul id="categoryList" class="sidebar-list">
                        <!-- 分類列表將動態加載 -->
                    </ul>
                </div>
                
                <!-- 文章部分 -->
                <div class="sidebar-section collapsible-section">
                    <div class="section-header">
                        <div class="section-title">
                            <i class="fas fa-file-alt"></i>
                            <span>文章</span>
                            <i class="fas fa-chevron-down toggle-icon" style="margin-left: 5px; font-size: 12px;"></i>
                        </div>
                        <div class="section-actions">
                            <button id="addPostBtn" class="btn-icon" title="新增文章">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                    <ul id="postList" class="sidebar-list">
                        <!-- 文章列表將動態加載 -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- 移動端側邊欄疊加層 -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- 主內容區 -->
        <div class="main-content">
            <div class="topbar">
                <div class="page-title" id="pageTitle">儀錶板</div>
                <div class="user-actions">
                    <button id="logoutBtn" class="btn btn-secondary">登出</button>
                </div>
            </div>
            <div class="content-area" id="contentArea">
                <!-- 默認歡迎頁 -->
                <div class="card">
                    <h2>歡迎使用部落格管理工具</h2>
                    <p>從左側選擇一個分類或文章開始編輯，或者新增一個新的項目。</p>
                </div>
                
                <!-- 文章編輯區域（初始隱藏） -->
                <div id="postEditor" style="display: none;">
                    <div class="card">
                        <h2 id="editorTitle">編輯文章</h2>
                        <form id="postForm">
                            <input type="hidden" id="editingId" value="">
                            <input type="hidden" id="editingCategoryIndex" value="">
                            <input type="hidden" id="editingPostIndex" value="">
                            
                            <div class="form-group">
                                <label for="title">標題</label>
                                <input type="text" id="title" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="category">分類</label>
                                <select id="category" required>
                                    <!-- 分類將動態載入 -->
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="date">日期</label>
                                <input type="date" id="date" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="description">描述</label>
                                <textarea id="description" required></textarea>
                            </div>
                            
                            <div class="form-group">
                                <label for="tags">標籤 (用逗號分隔)</label>
                                <input type="text" id="tags">
                            </div>
                            
                            <div class="form-group">
                                <label for="filePath">檔案路徑</label>
                                <input type="text" id="filePath" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="coverImage">封面圖片URL</label>
                                <input type="text" id="coverImage" required>
                            </div>
                            
                            <div style="display: flex; gap: 10px;">
                                <button type="submit" class="btn btn-primary">儲存文章</button>
                                <button type="button" id="cancelPostEdit" class="btn btn-secondary">取消</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- 分類編輯區域（初始隱藏） -->
                <div id="categoryEditor" style="display: none;">
                    <div class="card">
                        <h2 id="categoryEditorTitle">編輯分類</h2>
                        <form id="categoryForm">
                            <input type="hidden" id="editingCategoryId" value="">
                            
                            <div class="form-group">
                                <label for="categoryName">分類名稱</label>
                                <input type="text" id="categoryName" required>
                            </div>
                            
                            <div style="display: flex; gap: 10px;">
                                <button type="submit" class="btn btn-primary">儲存分類</button>
                                <button type="button" id="cancelCategoryEdit" class="btn btn-secondary">取消</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS腳本 -->
    <script src="script/pages/blog-admin-redesign/main.js"></script>
    <script src="script/pages/index/ui/theme-switcher.js"></script>
    <script src="script/pages/index/ui/back-to-top.js"></script>
</body>
</html>
